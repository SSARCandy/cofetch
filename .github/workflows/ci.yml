name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 19
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-19
      - name: clang-format check
        run: CLANG_FORMAT=clang-format-19 ./linter.sh

  cxx17-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libcurl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build smoke test as C++17
        run: g++ -std=c++17 -Wall -Wextra -isystem vendor/asio/include -Iinclude test/cxx17_smoke.cpp -lcurl -o cxx17_smoke
      - name: Run against local echo server
        run: |
          python3 test/echo_server.py --port 18089 &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:18089/get && break
            sleep 0.1
          done
          COFETCH_ECHO=http://127.0.0.1:18089 ./cxx17_smoke

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen
      - name: Generate API reference
        run: |
          doxygen Doxyfile
          mkdir -p docs/api/html/docs
          cp docs/benchmark-docs.svg docs/api/html/docs/benchmark-light.svg
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/html

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libcurl and gcovr
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev gcovr
      - name: Configure (Debug enables gcov)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCOFETCH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests against local echo server
        run: |
          python3 test/echo_server.py --port 18089 &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:18089/get && break
            sleep 0.1
          done
          COFETCH_ECHO=http://127.0.0.1:18089 ./build/test/all_test
      - name: Generate coverage report
        run: gcovr --root . --filter include/ --xml -o coverage.xml build
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # Without these the CLI's gcov plugin re-scans build/ and
          # uploads test/example coverage alongside the filtered XML.
          disable_search: true
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOFETCH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Run tests against local echo server
        run: |
          python3 test/echo_server.py --port 18089 &
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:18089/get && break
            sleep 0.1
          done
          COFETCH_ECHO=http://127.0.0.1:18089 ./build/test/all_test
