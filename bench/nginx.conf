# Local benchmark server: static JSON, keep-alive, logging off.
# Run:  nginx -p /tmp/cofetch-nginx -c <repo>/bench/nginx.conf
# Stop: nginx -p /tmp/cofetch-nginx -c <repo>/bench/nginx.conf -s stop
worker_processes 4;
pid nginx.pid;
error_log error.log;

events {
    worker_connections 4096;
}

http {
    access_log off;
    keepalive_requests 10000000;
    keepalive_timeout 300s;
    client_body_temp_path .;
    proxy_temp_path .;
    fastcgi_temp_path .;
    uwsgi_temp_path .;
    scgi_temp_path .;

    server {
        listen 127.0.0.1:18081 reuseport;
        default_type application/json;
        location / {
            return 200 '{"serverTime":1752130000000}';
        }
    }
}
